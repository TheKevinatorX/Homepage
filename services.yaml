#========== MEDIA CALENDARS ==========#
- Calendars:
    - Upcoming TV Shows:
        icon: sonarr.svg
        widget:
          type: calendar
          firstDayInWeek: monday
          view: agenda
          maxEvents: 8
          showTime: true
          integrations:
            - type: ical
              url: https://sonarr.{{HOMEPAGE_VAR_DOMAIN_NAME}}/feed/v3/calendar/Sonarr.ics?apikey={{HOMEPAGE_VAR_SONARR_API}}
              name: TV Shows
              color: orange
              params:
                showName: false
    - Upcoming Animes:
        icon: /images/Video2.png
        widget:
          type: calendar
          firstDayInWeek: monday
          view: agenda
          maxEvents: 8
          showTime: true
          integrations:
            - type: ical
              url: "{{HOMEPAGE_VAR_ANIMECALENDAR_URL}}"
              name: Dubbed Animes
              color: blue
              params:
                showName: false
    - Recently Added Shows:
        icon: sonarr.svg
        id: list
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8181/api/v2?apikey={{HOMEPAGE_VAR_TAUTULLI_API}}&cmd=get_recently_added&count=6&media_type=episode&section_id=2
          display: list
          mappings:
            - field:
                response:
                  data:
                    recently_added:
                      "0": grandparent_title
              additionalField:
                field:
                  response:
                    data:
                      recently_added:
                        "0": added_at
                scale: 1000
                format: relativeDate
                locale: en-GB
                numeric: auto
                style: narrow
                color: theme
            - field:
                response:
                  data:
                    recently_added:
                      "1": grandparent_title
              additionalField:
                field:
                  response:
                    data:
                      recently_added:
                        "1": added_at
                scale: 1000
                format: relativeDate
                locale: en-GB
                numeric: auto
                style: narrow
                color: theme
            - field:
                response:
                  data:
                    recently_added:
                      "2": grandparent_title
              additionalField:
                field:
                  response:
                    data:
                      recently_added:
                        "2": added_at
                scale: 1000
                format: relativeDate
                locale: en-GB
                numeric: auto
                style: narrow
                color: theme
            - field:
                response:
                  data:
                    recently_added:
                      "3": grandparent_title
              additionalField:
