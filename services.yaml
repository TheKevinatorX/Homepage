#========== SYSTEM MONITOR ==========#
- Server Statistics:
    - CPU:
        icon: /images/SystemInfo.png
        href: https://stats.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        widget:
          type: glances
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:61208
          metric: cpu
          version: 4
          chart: false
    - Memory:
        icon: /images/Memory.png
        href: https://stats.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        widget:
          type: glances
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:61208
          metric: memory
          version: 4
          chart: false
    - Processes:
        icon: /images/CPU.png
        href: https://stats.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        widget:
          type: glances
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:61208
          metric: process
          version: 4
          chart: true
    - Harddrive:
        icon: /images/LinuxDrive.png
        href: https://stats.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        widget:
          type: glances
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:61208
          metric: fs:/etc/hosts
          version: 4
          chart: false
#========== MEDIA SERVICES ==========#
- Media Services:
    - Plex:
        icon: plex.png
        href: https://tautulli.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Plex Video Streaming
        server: Servinator
        container: Tautulli
        widget:
          type: tautulli
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_API}}"
          enableUser: false
          showEpisodeNumber: true
          expandOneStreamToTwoRows: true
    - Plexamp:
        icon: sh-plexamp.png
        description: Plex Music Streaming
        server: Servinator
        container: TautulliMusic
        widget:
          type: tautulli
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8585/
          key: "{{HOMEPAGE_VAR_TAUTULLI_MUSIC_API}}"
          enableUser: false
          showEpisodeNumber: true
          expandOneStreamToTwoRows: true
    - Plexinator:
        icon: plex.svg
        href: https://plex.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Plex Media Server
        server: Servinator
        container: Plex
        widget:
          type: plex
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:32400
          key: "{{HOMEPAGE_VAR_PLEX_API}}"
          fields:
            - tv
            - movies
    - Jellinator:
        icon: jellyfin.svg
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Backup Media Server
        server: Servinator
        container: Jellyfin
        widget:
          type: jellyfin
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API}}"
          fields: 
            - movies
            - series
            - episodes
            - songs
          enableBlocks: true
          enableNowPlaying: false
    - TitleCardMaker:
        icon: /images/tcm.png
        href: https://cards.{{HOMEPAGE_VAR_DOMAIN_NAME}}
        description: Episode Titlecards
        server: Servinator
        container: TitleCardMaker
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:4242/api/statistics/system
          method: GET
          mappings:
            - field:
                1: value
              label: Shows
              format: number
            - field:
                5: value
              label: Cards
              format: number
            - field:
                6: value_text
              label: Size
              format: float
              suffix: GB
    - Immich:
        icon: immich.svg
        href: https://photos.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Home Photos and Videos
        server: Servinator
        container: Immich-Server
        widget:
          type: immich
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
          fields:
            - photos
            - videos
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbit.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Torrent Downloader
        server: Servinator
        container: qBittorrent
        widget:
          type: qbittorrent
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8686
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PWD}}"
          enableLeechProgress: true
          fields:
            - seed
            - download
            - upload
    - Usenet:
        icon: sabnzbd.svg
        href: https://usenet.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Usenet Downloader
        server: Servinator
        container: Sabnzbd
        widget:
          type: sabnzbd
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8808
          key: "{{HOMEPAGE_VAR_SABNZBD_API}}"
#========== HOMELAB MANAGEMENT ==========#
- Home Monitor:
    - Beszel:
        icon: beszel.png
        href: https://beszel.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Ubuntu Server Statistics
        server: Servinator
        container: Beszel
        widget:
          type: beszel
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8090
          username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PWD}}"
          systemId: Ubuntu
          version: 2
          fields:
            - cpu
            - memory
            - disk
    - Home Router:
        icon: watchyourlan.png
        href: https://netalertx.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Home Network Devices
        server: Servinator
        container: NetAlertX
        widget:
          type: netalertx
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:20211
          key: "{{HOMEPAGE_VAR_NETALERTX_API}}"
          fields:
            - connected
            - total
    - Synology NAS:
        icon: /images/NAS.png
        href: https://synology.{{HOMEPAGE_VAR_DOMAIN_NAME}}
        description: Storage
        server: Servinator
        container: Sabnzbd
        widget:
          type: diskstation
          url: http://{{HOMEPAGE_VAR_SYNOLOGY_IP}}:5000
          username: "{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}"
          password: "{{HOMEPAGE_VAR_SYNOLOGY_PWD}}"
          fields:
            - uptime
            - volumeAvailable
    - Authentik:
        icon: authentik.png
        href: https://authentik.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Single Sign-On
        server: Servinator
        container: Authentik
        widget:
          type: authentik
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:9000
          key: "{{HOMEPAGE_VAR_AUTHENTIK_API}}"
          version: 2
          fields:
            - loginsLast24H
            - failedLoginsLast24H
    - Traefik:
        icon: traefik.svg
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Reverse Proxy
        server: Servinator
        container: Traefik
        widget:
          type: traefik
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8080
          fields:
            - routers
            - services
            - middleware
    - Komodo:
        icon: sh-komodo-light.png
        href: https://komodo.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Docker Container Management
        server: Servinator
        container: Komodo
        widget:
          type: komodo
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:9120
          key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
          fields:
            - total
            - stopped
            - unhealthy
    - Uptime-Kuma:
        icon: /images/Uptime2.png
        href: https://uptime.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Services Uptime Monitor
        server: Servinator
        container: Uptime-Kuma
        widget:
          type: uptimekuma
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:3001/
          slug: ubuntu
          fields:
            - up
            - down
            - uptime
    - Speedtest:
        icon: speedtest-tracker.png
        href: https://speedtest.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Network Speed Results
        container: Speedtest
        widget:
          type: speedtest
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:2255
          bitratePrecision: 2
          fields:
            - download
            - upload
    - Cloudflared:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com
        description: Remote Access
        server: Servinator
        container: Cloudflared
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN_ID}}"
          fields:
            - status
            - origin_ip
    - Karakeep:
        icon: karakeep.png
        href: https://karakeep.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Web Content Collector
        container: Karakeep
        widget:
          type: karakeep
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:3003
          key: "{{HOMEPAGE_VAR_KARAKEEP_TOKEN}}"
          fields:
            - bookmarks
            - favorites
            - archived
    - Wallos:
        icon: google-wallet.png
        href: https://wallos.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Monthly Subscription Payments
        container: Wallos
        widget:
          type: wallos
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:8282
          key: "{{HOMEPAGE_VAR_WALLOS_KEY}}"
          fields:
            - activeSubscriptions
            - thisMonthlyCost
            - nextMonthlyCost
    - Filebrowser:
        icon: files.png
        href: https://files.{{HOMEPAGE_VAR_DOMAIN_NAME}}/
        description: Ubuntu File Manager
        container: Filebrowser
        widget:
          type: filebrowser
          url: http://{{HOMEPAGE_VAR_LOCAL_IP}}:7077
          username:
          password:
          authHeader:
