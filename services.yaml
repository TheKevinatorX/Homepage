                  response:
                    data:
                      recently_added:
                        "3": added_at
                scale: 1000
                format: relativeDate
                locale: en-GB
                numeric: auto
                style: narrow
                color: theme
            - field:
                response:
                  data:
                    recently_added:
                      "4": grandparent_title
              additionalField:
